<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../slides/slides.css"><link rel="stylesheet" href="motion.css">
<style>.searching{font-size:38px;font-weight:700;background:rgba(0,0,0,.7);padding:12px 30px;border-radius:999px}.mode{opacity:0}.navtop .dst{min-height:1.3em;display:block}</style></head>
<body><div class="s" id="stage"></div>
<script type="module">
// Pioneer 10's nav app (about 35 s). The nav screens are our dramatization. Art: NASA Ames / Rick Guidice. Photos: NASA Ames.
import { M, T, LANG, el, img, sfx, music, win, pop, kb, punch, shake, flash, slideIn, count, type, scene, add, tag, h, bx, done } from './motion.js';
const st = document.getElementById('stage'); M.dur = 35.2; M.poster = 7.4;
music('Local_Forecast_-_Elevator', 0, M.dur, { from: 0.3, gain: 0.75, fadeOut: 0.6 });
const ART = 'ARC-1973-AC73-4247_c', CRA = T('想像図：木星の近くを通るパイオニア10号（NASA Ames／Rick Guidice）', 'Artist’s concept: Pioneer 10 passing Jupiter (NASA Ames / Rick Guidice)');

// A: destination and arrival time
let s = scene(st, 0, 9.2, { bg: ART, pos: '62% 50%', filt: 'brightness(.72)', move: { s0: 1.02, s1: 1.14 }, cr: CRA, colStyle: 'top:310px' });
add(s.col, h(T('パイオニア10号の<br>カーナビを見てみた', 'I checked Pioneer 10’s<br>nav app'), 'md'), 0.2);
let nt = el(`<div class="wrap"><div class="navtop"><span style="font-size:54px">📍</span><div><small>${T('目的地', 'Destination')}</small><span class="dst"></span></div></div></div>`, s.col); slideIn(nt, 1.1, { from: 'translateY(-60px)', snd: 'pop' });
type(nt.querySelector('.dst'), 1.6, T('アルデバラン（おうし座の赤い星）', 'Aldebaran (red star in Taurus)'), LANG === 'ja' ? 11 : 20);
const se = el(`<div class="wrap"><div class="searching">${T('ルートを検索中…', 'Finding a route…')}</div></div>`, s.col); win(se, 3.4, 4.7, 0.12);
const sh = el(`<div class="wrap" style="position:absolute;top:372px"><div class="sheet"><div class="lbl">${T('到着予定', 'Arrival')}</div><div class="eta">${T('約<span class="n">0</span>万年後', 'in ~<span class="n">0</span> million yr')}</div>
  <div class="sub">${T('距離 68光年', 'Distance: 68 light-years')}</div><div class="go">${T('案内を開始', 'Start')}</div></div></div>`, s.col); slideIn(sh, 4.7, { snd: 'whoosh' });
count(sh.querySelector('.n'), 4.95, 1.9, 0, LANG === 'ja' ? 200 : 2, LANG === 'ja' ? v => Math.round(v) : v => v.toFixed(v >= 1.995 ? 0 : 1));
sfx(6.9, 'ding'); punch(sh, 6.9, { scale: 1.08 });

// B: other ways to get there
s = scene(st, 9.2, 18.4, { bg: ART, pos: '62% 50%', filt: 'brightness(.45)', shade: null, move: { s0: 1.14, s1: 1.2 }, colStyle: 'top:330px' });
add(s.col, h(T('ほかの行き方も調べた', 'I checked other routes'), 'md'), 9.4, { snd: 'whoosh' });
const md = el(`<div class="wrap"><div class="modes">
  <div class="mode"><span class="ic">🚶</span><div class="nm">${T('歩く', 'Walk')}<small>${T('時速4km・休みなし', '4 km/h, no breaks')}</small></div><span class="tm">${T('約<span class="n">0</span>億年', '~<span class="n">0</span> billion yr')}</span></div>
  <div class="mode"><span class="ic">🚗</span><div class="nm">${T('車', 'Car')}<small>${T('時速100km', '100 km/h')}</small></div><span class="tm">${T('約<span class="n">0</span>億年', '~<span class="n">0</span> million yr')}</span></div>
  <div class="mode"><span class="ic">🚄</span><div class="nm">${T('新幹線', 'Bullet train')}<small>${T('時速300km', '300 km/h')}</small></div><span class="tm">${T('約<span class="n">0</span>億年', '~<span class="n">0</span> million yr')}</span></div>
  <div class="mode best"><span class="ic">🛰️</span><div class="nm">${T('パイオニア10号', 'Pioneer 10')}<span class="badge">${T('最速', 'FASTEST')}</span></div><span class="tm">${T('約200万年', '~2 million yr')}</span></div></div></div>`, s.col);
pop(md, 10.0, { snd: null });
const rows = [...md.querySelectorAll('.mode')], ja = LANG === 'ja';
const row = (i, at, to, fmt, end) => { pop(rows[i], at, { from: 'translateX(-40px)', snd: 'pop' }); const n = rows[i].querySelector('.n'); if (n) { count(n, at + 0.15, 1.0, 0, to, fmt); sfx(at + 1.2, end, 0.8); } };
row(0, 10.3, ja ? 180 : 18, v => Math.round(v), 'thud');
row(1, 12.0, ja ? 7 : 730, v => Math.round(v), 'pop');
row(2, 13.5, ja ? 2.4 : 240, ja ? v => v.toFixed(1) : v => Math.round(v), 'pop');
pop(rows[3], 15.0, { from: 'translateX(-40px)', snd: 'ding' });
add(s.col, bx(T('歩くと、宇宙の年齢（138億年）より長い', 'Walking takes longer than the age of the universe (13.8 billion years)'), 'sm yellow'), 16.4, { snd: 'thud', gain: 0.6 });

// C: current location
s = scene(st, 18.4, 23.6, { bg: 'ARC-1973-AC73-9019_c', pos: '50% 40%', filt: 'brightness(.8)', move: { s0: 1.0, s1: 1.1 }, cr: T('本物の写真：組み立て中のパイオニア10号（NASA Ames）', 'Real photo: Pioneer 10 being assembled (NASA Ames)') });
nt = el(`<div class="wrap"><div class="navtop"><span style="font-size:54px">📡</span><div><small>${T('現在地', 'Current location')}</small><span style="color:#e5202a">${T('わからない（圏外）', 'Unknown (out of range)')}</span></div></div></div>`, s.col); slideIn(nt, 18.6, { from: 'translateY(-60px)', snd: 'buzz' });
add(s.col, bx(T('最後に信号がとどいたのは2003年1月', 'Its last signal arrived in January 2003'), 'sm'), 19.9);
add(s.col, bx(T('そのとき地球から約122億km。電波でも11時間20分かかった', 'It was 12.2 billion km away. Even radio took 11 h 20 min'), 'sm'), 21.4);

// D: the plaque
s = scene(st, 23.6, 28.6, { bg: ART, pos: '62% 50%', filt: 'blur(12px) brightness(.4)', shade: null, move: { s0: 1.1, s1: 1.1 } });
add(s.col, h(T('いちおう<em>名刺</em>は持ってる', 'It does carry a<br><em>business card</em>'), 'md'), 23.8, { snd: 'whoosh' });
const ph = el(`<div class="wrap"><figure class="ph" style="width:840px"><img src="${img('ARC-1972-AC72-1338_c')}" style="width:808px;height:630px;object-fit:cover"><figcaption>${T('パイオニア10号にのせた金属の板（NASA Ames）', 'The plaque carried by Pioneer 10 (NASA Ames)')}</figcaption></figure></div>`, s.col);
pop(ph, 24.4, { from: 'rotate(8deg) scale(.6)', to: 'rotate(-1.5deg)' });
add(s.col, bx(T('だれかに拾われたとき用', 'In case someone finds it'), 'sm'), 25.8);
add(s.col, bx(T('地球の場所と、人間の絵がかいてある', 'It shows where Earth is, and what we look like'), 'sm'), 27.0);

// E: continue straight for 2 million years
s = scene(st, 28.6, M.dur, { bg: ART, pos: '62% 50%', filt: 'brightness(.75)', move: { s0: 1.2, s1: 1.04 }, cr: CRA });
const tn = el(`<div class="wrap"><div class="turn"><span class="ar">⬆</span><div>${T('この先 200万年、<br>道なりです', 'Continue straight<br>for 2 million years')}</div></div></div>`, s.col); slideIn(tn, 28.8, { from: 'translateY(-80px)', snd: 'chime' });
add(s.col, bx(T('予定は21か月の旅 → 30年以上、信号を送りつづけた', 'Planned: a 21-month trip → it kept calling home for 30+ years'), 'sm'), 30.6);
add(s.col, bx(T('今も、だまって飛びつづけてる', 'It is still flying, silently'), 'sm green'), 32.3);
done();
</script></body></html>
